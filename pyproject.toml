[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intelligent-agent-runtime"
version = "1.0.0"
description = "可恢复的知识与课程业务 Agent 运行时"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0,<3", "aiosqlite>=0.21,<1", "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.4,<1", "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "langgraph-checkpoint-postgres>=3,<4", "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7", "jieba>=0.42,<1", "boto3>=1.35,<2", "prometheus-client>=0.22,<1",
  "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2", "aio-pika>=9.5,<10"
]

[project.optional-dependencies]
documents = ["docling>=2,<3"]
rerank = ["FlagEmbedding>=1.3,<2"]

[tool.hatch.build.targets.wheel]
packages = ["iiip_agent"]

[tool.black]
line-length = 100
target-version = ["py312"]
